services:
  drupal:
    build: .
    container_name: drupal_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Variables de entorno para conexión a DB externa
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_DRIVER=${DB_DRIVER}
      
      # Variables de entorno opcionales (usar valores del .env o defaults)
      - MEMORY_LIMIT=${MEMORY_LIMIT:-1024M}
      - UPLOAD_MAX_FILESIZE=${UPLOAD_MAX_FILESIZE:-1024M}
      - POST_MAX_SIZE=${POST_MAX_SIZE:-1024M}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME:-300}
      - APACHE_TIMEOUT=${APACHE_TIMEOUT:-300}
      - APACHE_KEEPALIVE=${APACHE_KEEPALIVE:-On}
      - APACHE_MAX_KEEPALIVE_REQUESTS=${APACHE_MAX_KEEPALIVE_REQUESTS:-100}
      - APACHE_KEEPALIVE_TIMEOUT=${APACHE_KEEPALIVE_TIMEOUT:-5}
      - PHP_MAX_CHILDREN=${PHP_MAX_CHILDREN:-50}
      - PHP_START_SERVERS=${PHP_START_SERVERS:-5}
      - PHP_MIN_SPARE_SERVERS=${PHP_MIN_SPARE_SERVERS:-5}
      - PHP_MAX_SPARE_SERVERS=${PHP_MAX_SPARE_SERVERS:-10}
      - OPCACHE_MEMORY_CONSUMPTION=${OPCACHE_MEMORY_CONSUMPTION:-256}
      - OPCACHE_MAX_ACCELERATED_FILES=${OPCACHE_MAX_ACCELERATED_FILES:-10000}
      
    volumes:
      - drupal_files:/var/www/html/web/sites/default/files
      - apache_logs:/var/log/apache2
      - php_logs:/var/log/php
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
          
    # Configuración de ulimits para manejar muchos archivos
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
        
    # Configuración de logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volúmenes nombrados para persistencia
volumes:
  drupal_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUME_PATH:-./files}s
  apache_logs:
    driver: local
  php_logs:
    driver: local
