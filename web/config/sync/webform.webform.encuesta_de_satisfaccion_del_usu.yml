id: encuesta_de_satisfaccion_del_usu
title: 'Encuesta de satisfacción del usuario - visa en Linea y Presencial'
description: "<p style=\"text-align: center;\"><strong>ENCUESTA DE SATISFACCI&Oacute;N DEL USUARIO &ndash; GRUPO INTERNO DE TRABAJO DE VISAS E INMIGRACI&Oacute;N. </strong></p>\r\n\r\n<p style=\"text-align: center;\"><strong>VISA EN LINEA Y PRESENCIAL&nbsp;</strong></p>\r\n\r\n<p style=\"text-align: center;\">&nbsp;</p>\r\n\r\n<p><strong>Se&ntilde;or Usuario: </strong>El Ministerio de Relaciones Exteriores se encuentra realizando una encuesta para conocer su nivel de satisfacci&oacute;n y percepci&oacute;n frente a los servicios de la Oficina de Visas e Inmigraci&oacute;n.</p>\r\n\r\n<p>Ay&uacute;denos para prestarle un mejor servicio.</p>\r\n\r\n<p><span style=\"font-size:13.008px; line-height:1.538em\">Tiempo aproximado en diligenciar la encuesta: 1 minutos</span></p>"
category: ''
