    '#type': textfield
    '#title': "Número de solicitud\t"
  edad:
    '#type': radios
    '#title': Edad
    '#options':
      1: 'De 18 a 35 años'
      2: 'De 36 a 55 años'
      3: 'Mayor de 56 años'
    '#required': true
  1_por_cual_medio_realizo_su_tramite_:
    '#type': radios
    '#title': "1. ¿Por cuál medio realizó su trámite?\t"
    '#options':
      a: Presencial
