id: consulta_audiencia_publica_de_re
title: 'CONSULTA AUDIENCIA PÚBLICA DE RENDICIÓN DE CUENTAS DEL SECTOR DE RELACIONES EXTERIORES 2010-2018'
description: ''
category: ''
elements: |-
  markup:
    '#type': webform_markup
    '#markup': 'El Ministerio de Relaciones Exteriores de Colombia en su calidad de organismo rector del Sector Administrativo de Relaciones Exteriores, la Unidad Administrativa Especial Migraci&oacute;n Colombia y el Fondo Rotatorio del Ministerio de Relaciones Exteriores, invitan a la ciudadan&iacute;a en general a participar en la definici&oacute;n de los temas que se abordar&aacute;n en la Audiencia P&uacute;blica de Rendici&oacute;n de Cuentas 2010-2018.'
  participe_en_la_seleccion_de_los_temas_a_tratar_durante_la_audie:
    '#type': webform_checkboxes_other
    '#title': 'Participe en la selección de los temas a tratar durante la audiencia, señalando los que resulten de su interés (selección múltiple):'
    '#options':
      1: 'Cumplimiento de metas'
      2: Presupuesto
      3: 'Contratación '
      4: 'Acciones de mejoramiento'
      5: 'Política exterior de Colombia'
      6: 'Política migratoria'
      7: 'Gestión consular'
      8: 'Atención al ciudadano'
      9: 'Relaciones internacionales'
      10: 'Cooperación internacional'
      11: 'Fortalecimiento de fronteras y defensa de la soberanía nacional'
      12: 'Fortalecimiento institucional'
      13: 'Administración del servicio exterior'
      14: 'Participación de Colombia en organismos internacionales'
      15: 'Impacto de la gestión'
      16: 'Diplomacia Deportiva y Cultural'
      17: 'Control migratorio'
      18: 'Trámites y servicios'
      19: 'Alianza del Pacífico'
      20: 'Eliminación de requisitos para visas de turismo a colombianos'
      21: 'Gabinetes binacionales'
    '#other__option_label': Otro...
    '#other__placeholder': '¿Qué otro tema le gustaría tratar?'
