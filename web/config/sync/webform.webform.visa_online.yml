id: visa_online
title: 'Visa Online'
description: ''
category: ''
elements: |-
  index:
    '#type': webform_markup
    '#markup': |-
      <p style="text-align: center;"><strong>SATISFACTION SURVEY - WORKING GROUP OF VISAS AND IMMIGRATION.</strong><br>
      	<strong>VISA ONLINE AND PRESENTIAL&nbsp;</strong></p>
      <p style="text-align: center;">&nbsp;</p>
      <p><strong>Dear Visitor:</strong> The Ministry of Foreign Affairs is conducting a survey to know your level of satisfaction and perception regarding the services of the Office of Visas and Immigration.<br>
      	<br>
      	Help us to serve you better.<br>
      	<br>
      	Approximate time to fill out the survey: 1 minutes.</p>
  application_number:
    '#type': number
    '#title': 'Application Number'
    '#required': true
  age:
    '#type': radios
    '#title': Age
    '#options':
      1: 'Between 18 to 35 years'
      2: 'Between  36 to 55 years'
      3: 'Older than 56'
    '#required': true
  1_by_what_means_did_you_do_the_procedure_:
    '#type': radios
    '#title': '1. By what means did you do the procedure?'
    '#options':
      a: 'In person'
      b: Online
    '#required': true
  2_if_you_performed_the_procedure_in_person_how_satisfied_are_you:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
    '#markup': '<p><strong>2. If you performed the procedure in person, how satisfied are you in terms of</strong></p>'
  a_access_to_facilities:
    '#type': select
    '#title': 'A. Access to facilities'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  b_comfort_in_waiting_toilet_ventilation_organization_etc_:
    '#type': select
    '#title': 'B. Comfort in waiting (toilet, ventilation, organization, etc.)'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  c_treatment_by_the_visas_officials_inside_of_bureau_:
    '#type': select
    '#title': 'C. Treatment by the Visas officials inside of bureau  '
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: 'Dissatisfied '
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  3_if_you_performed_the_procedure_online_how_satisfied_are_you_re:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
    '#markup': '<p><strong>3. If you performed the procedure online, how satisfied are you regarding:</strong></p>'
  a_easy_access_to_information:
    '#type': select
    '#title': 'A. Easy access to information'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  b_clarity_of_information_provided:
    '#type': select
    '#title': 'B. Clarity of information provided'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  c_simplicity_and_clarity_in_the_form_online:
    '#type': select
    '#title': 'C. Simplicity and Clarity in the Form Online'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  d_agility_in_the_general_procedure:
    '#type': select
    '#title': 'D. Agility in the general procedure'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  4_in_what_ways_do_you_think_we_can_improve_:
    '#type': textfield
    '#title': '4. ¿In what ways do you think we can improve?'
  thanks_for_your_cooperation:
    '#type': webform_markup
    '#markup': '<p><strong>Thanks for your cooperation</strong></p>'
