    '#type': radios
    '#title': "La organización, comodidad, aseo, servicio de WI FI y pantallas informativas dentro de las instalaciones de la Oficina de Apostilla y Legalizaciones, a su consideración es:\t"
    '#options':
      1: 'Muy buena'
      2: Buena
      3: Regular
      4: Mala
      5: 'Muy mala'
    '#required': true
  5_por_favor_formule_sus_sugerencias_para_mejorar_la_prestacion_d:
