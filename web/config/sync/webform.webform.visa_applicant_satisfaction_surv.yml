    '#title': '2. How satisfied or dissatisfied are you with the service given by the Ministry of Foreign Affair`s personnel you had contact with:'
    '#options':
      1: 'Very satisfied'
      2: Satisfied
      3: 'Somewhat satisfied'
      4: 'Somewhat dissatisfied'
      5: 'Very dissatisfied'
  3_how_satisfied_or_dissatisfied_are_you_with_the_time_frame_for_:
    '#type': radios
    '#title': '3. How satisfied or dissatisfied are you with the time frame for receiving the final decision on your visa application (starting from the online application to the final answer):'
    '#options':
      1: 'Very satisfied'
      2: Satisfied
      3: 'Somewhat satisfied'
      4: 'Somewhat dissatisfied'
      5: 'Very dissatisfied'
  4_how_satisfied_or_dissatisfied_are_you_with_the_waiting_room_fa:
    '#type': radios
    '#title': '4. How satisfied or dissatisfied are you with the waiting room facilities (Restroom, space distribution, airiness, cleanliness):'
    '#options':
      1: 'Very satisfied'
      2: Satisfied
      3: 'Somewhat satisfied'
      4: 'Somewhat dissatisfied'
      5: 'Very dissatisfied'
  5_please_leave_us_your_comments_on_how_we_can_improve_our_servic:
