    '#markup': |-
      <p><strong>Se&ntilde;or Usuario:</strong></p>

      <p>Reciba un cordial saludo. El Ministerio de Relaciones Exteriores, solicita su colaboraci&oacute;n diligenciando la siguiente encuesta, cuyos resultados pretenden conocer y mejorar nuestro desempe&ntilde;o y la calidad del servicio prestado.</p>

      <p>Tiempo de respuesta 1 minuto.</p>

      <p>&nbsp;</p>
