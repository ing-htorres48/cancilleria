id: encuesta_de_medicion_para_el_pro
title: 'Encuesta de medición para el Proceso de Evaluación de Rendición de Cuentas'
description: ''
category: ''
elements: |-
  fecha:
    '#type': date
    '#title': Fecha
    '#required': true
    '#required_error': 'diligenciar con fecha actual '
    '#default_value': '[current-date:long]'
  index:
    '#type': webform_markup
    '#markup': |-
      <p><strong>MINISTERIO DE RELACIONES EXTERIORES</strong></p>
      <p>Los campos marcados con asterisco (<span style="color:#ff0000;">*</span>) son de carácter obligatorio&nbsp;</p>
  ciudad_:
    '#type': textfield
    '#title': 'Ciudad:'
    '#required': true
  sexo_:
    '#type': radios
    '#title': 'Sexo:'
    '#options':
      f): F
      m): M
  1_cual_o_cuales_de_los_siguientes_mecanismos_de_rendicion_de_cue:
    '#type': webform_likert
    '#title': '1. ¿Cuál o cuáles de los siguientes mecanismos de Rendición de Cuentas que tiene el Ministerio de Relaciones Exteriores conoce usted?'
    '#description': '<p>Califique los que conozca de 1 a 5, siendo 5 excelente y 1 p&eacute;simo.</p>'
    '#questions':
      a: 'A. Audiencias Públicas'
      b: 'B. Memorias al Congreso'
      c: 'C. Veeduría Ciudadana'
      d: 'D. Correo electrónico'
      e: 'E. Vía telefónica'
      f: 'F. Chat'
      g: 'G. Videollamada (Disponible en la página)'
      h: 'H. Llamada en línea (Disponible en la plataforma telefónica)'
      i: 'I. Urna de cristal'
      j: 'J. Encuestas de satisfacción'
      k: 'K. Redes sociales (Twitter, Facebook, flirck, Instagram, YouTube)'
      l: 'I. Foros virtuales para colombianos en el exterior'
      m: 'M. Feria de servicios para colombianos en el exterior'
      'n': 'N. Página Web de la Entidad'
    '#answers':
      5: '5'
      4: '4'
      3: '3'
      2: '2'
      1: '1'
  2_de_los_espacios_que_se_utilizan_para_rendicion_de_cuentas_cual:
    '#type': radios
    '#title': '2. De los espacios que se utilizan para rendición  de cuentas, ¿cuál le gustaría que se utilizara para brindar información?'
    '#options':
      'A. Reuniones zonales': 'A. Reuniones zonales'
      'B. Foros virtuales de discusión': 'B. Foros virtuales de discusión'
      'C. Mesas de trabajo de acuerdo al tema especifico': 'C. Mesas de trabajo de acuerdo al tema especifico'
      'D. Ferias de la gestión': 'D. Ferias de la gestión'
      'E. Redes sociales: Twitter, Facebook, Flickr, Instagram, Youtube': 'E. Redes sociales: Twitter, Facebook, Flickr, Instagram, Youtube'
      'F. Audiencia pública de rendición de cuentas': 'F. Audiencia pública de rendición de cuentas'
    '#required': true
  3_de_los_medios_de_divulgacion_y_comunicacion_por_favor_seleccio:
    '#type': radios
    '#title': '3. De los medios de divulgación y comunicación, por favor seleccione ¿cuál le gustaría que se utilizara para brindar información en 2016? '
    '#options':
      'A. Cartillas didácticas virtuales ': 'A. Cartillas didácticas virtuales '
      'B. Boletines mensuales virtuales': 'B. Boletines mensuales virtuales'
      'C. Murales o carteleras didácticas en quioscos': 'C. Murales o carteleras didácticas en quioscos'
      'D. Perifoneo': 'D. Perifoneo'
      'E. Emisoras locales o comunitarias': 'E. Emisoras locales o comunitarias'
      'F. Noticias permanentes en prensa local y nacional ': 'F. Noticias permanentes en prensa local y nacional '
      'G. Interacción en línea a través de: chat, videoclips, foros, diapositivas': 'G. Interacción en línea a través de: chat, videoclips, foros, diapositivas'
    '#required': true
  4_marque_los_temas_del_ministerio_que_sean_de_su_interes_para_se:
    '#type': webform_checkboxes_other
    '#title': '4. Marque los temas del Ministerio que sean de su interés para ser tratados en la rendición de cuentas:'
    '#options':
      'Trámites y servicios': 'Trámites y servicios'
      'Procesos de convocatoria y contratación': 'Procesos de convocatoria y contratación'
      'Ingreso a la Academia Diplomática': 'Ingreso a la Academia Diplomática'
      'Asistencia a connacionales': 'Asistencia a connacionales'
      'Relaciones bilaterales': 'Relaciones bilaterales'
      'Relaciones multilaterales': 'Relaciones multilaterales'
      'Plan Promoción de Colombia en el Exterior': 'Plan Promoción de Colombia en el Exterior'
      'Programa de Diplomacia Deportiva y Cultural': 'Programa de Diplomacia Deportiva y Cultural'
      Presupuesto: Presupuesto
      'Política migratoria': 'Política migratoria'
      'Canales de atención en el país y en el exterior': 'Canales de atención en el país y en el exterior'
      'Mecanismos de integración regional': 'Mecanismos de integración regional'
      'Plan Fronteras para la Prosperidad': 'Plan Fronteras para la Prosperidad'
    '#required': true
  si_tiene_observaciones_o_sugerencias_e_ideas_para_mejorar_el_pro:
    '#type': textfield
    '#title': 'Si tiene observaciones o sugerencias e ideas para mejorar el proceso de Rendición de Cuentas del Ministerio de Relaciones Exteriores, escríbalas aquí:'
  index1:
    '#type': webform_markup
    '#markup': '<p><strong>¡GRACIAS POR SU COLABORACIÓN!</strong></p>'
