id: encuesta_de_visa_en_linea_presen
title: 'ENCUESTA DE VISA EN LÍNEA - PRESENCIAL'
description: ''
category: ''
elements: |-
  index:
    '#type': webform_markup
    '#markup': |-
      <p style="font-size: 13.008px; line-height: 20.0063px; text-align: center;"><strong>ENCUESTA DE SATISFACCIÓN DEL USUARIO – GRUPO INTERNO DE TRABAJO DE VISAS E INMIGRACIÓN.</strong></p>
      <p style="font-size: 13.008px; line-height: 20.0063px; text-align: center;"><strong>VISA EN LINEA Y PRESENCIAL&nbsp;</strong></p>
      <p style="font-size: 13.008px; line-height: 20.0063px; text-align: center;">&nbsp;</p>
      <p style="font-size: 13.008px; line-height: 20.0063px;"><strong>Señor Usuario:&nbsp;</strong>El Ministerio de Relaciones Exteriores se encuentra realizando una encuesta para conocer su nivel de satisfacción y percepción frente a los servicios de la Oficina de Visas e Inmigración.</p>
      <p style="font-size: 13.008px; line-height: 20.0063px;">Ayúdenos para prestarle un mejor servicio.</p>
      <p style="font-size: 13.008px; line-height: 20.0063px;"><span style="font-size: 13.008px; line-height: 1.538em;">Tiempo aproximado en diligenciar la encuesta: 1 minutos</span></p>
  application_number:
    '#type': number
    '#title': 'Número de Solicitud'
    '#required': true
  age:
    '#type': radios
    '#title': Edad
    '#options':
      1: 'Entre 18 a 35 años'
      2: 'Entre 36 a 55 años'
      3: 'Mas de 56 años'
    '#required': true
  1_by_what_means_did_you_do_the_procedure_:
    '#type': radios
    '#title': '1. ¿Por cuál medio realizó su trámite?'
    '#options':
      a: 'En persona'
      b: 'En linea'
    '#required': true
  2_if_you_performed_the_procedure_in_person_how_satisfied_are_you:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
    '#markup': '<p><strong style="font-size: 13.008px; line-height: 20.0063px;">2. Si realizó el trámite presencial, que tan satisfecho se encuentra usted en cuanto a:</strong></p>'
  a_access_to_facilities:
    '#type': select
    '#title': 'A. Acceso a las instalaciones'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  b_comfort_in_waiting_toilet_ventilation_organization_etc_:
    '#type': select
    '#title': 'B. Comodidad en la espera (Aseo, ventilación, organización, etc.)'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  c_treatment_by_the_visas_officials_inside_of_bureau_:
    '#type': select
    '#title': 'C. Trato recibido por los funcionarios de la oficina'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: a
  3_if_you_performed_the_procedure_online_how_satisfied_are_you_re:
    '#type': webform_markup
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
    '#markup': '<p><strong style="font-size: 13.008px; line-height: 20.0063px;">3. Si realizó el trámite en línea, que tan satisfecho se encuentra en relación a:</strong></p>'
  a_easy_access_to_information:
    '#type': select
    '#title': 'A. Facilidad acceso a la información'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  b_clarity_of_information_provided:
    '#type': select
    '#title': 'B. Claridad en la Información suministrada'
    '#options':
      1: 'All Satisfied'
      2: Satisfied
      3: 'Medium Dissatisfied'
      4: Dissatisfied
      5: 'All Dissatisfied'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  c_simplicity_and_clarity_in_the_form_online:
    '#type': select
    '#title': 'C. Sencillez y Claridad del Formulario en Línea'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  d_agility_in_the_general_procedure:
    '#type': select
    '#title': 'D. Agilidad del trámite en general'
    '#options':
      1: 'Totalmente satisfecho'
      2: Satisfecho
      3: 'Medianamente satisfecho'
      4: Insatisfecho
      5: 'Totalmente insatisfecho'
    '#required': true
    '#states':
      visible:
        ':input[name="1_by_what_means_did_you_do_the_procedure_"]':
          value: b
  4_in_what_ways_do_you_think_we_can_improve_:
    '#type': textfield
    '#title': '4. ¿En qué aspectos considera que podemos mejorar?'
  thanks_for_your_cooperation:
    '#type': webform_markup
    '#markup': '<p><strong style="font-family: Arial, ''Arial Unicode MS'', Helvetica, sans-serif; font-size: 13px; line-height: 16.25px;">¡GRACIAS POR SU COLABORACION!</strong></p>'
