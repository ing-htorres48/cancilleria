      'No': 'No'
  2_si_necesita_saber_algo_del_mre_a_que_fuente_recurre_marque_tod:
    '#type': webform_checkboxes_other
    '#title': '2. Si necesita saber algo del MRE ¿A qué fuente recurre? marque todos los que utilice.'
    '#multiple': 11
    '#options':
      Intranet: Intranet
      'Periódico digital El Correo': 'Periódico digital El Correo'
