    '#options_none_value': otros
    '#options_none_text': otros...
  3_califique_la_calidad_de_la_informacion_divulgada_a_traves_de_l:
    '#type': radios
    '#title': "3.\tCalifique la calidad de la información divulgada a través de los canales internos de comunicación de Cancillería (Intranet, periódico digital “EL CORREO”, Correo Electrónico Comunicaciones Cancillería, Quioscos Digitales)"
    '#options':
      4: 'Excelente (4)'
      3: 'Buena (3)'
      2: 'Regular (2)'
      1: 'Mala (1) '
  4_ha_utilizado_usted_los_canales_internos_de_comunicacion_para_d:
    '#type': radios
    '#title': "4.\t¿Ha utilizado usted los canales internos de comunicación para divulgar información de su interés?"
    '#options':
      Si: Si
      'No': 'No'
  5_tiene_sugerencias_sobre_como_mejorar_la_comunicacion_interna_d:
    '#type': textarea
    '#title': "5.\tTiene sugerencias sobre cómo mejorar la comunicación interna de la Cancillería. Déjenoslo saber"
