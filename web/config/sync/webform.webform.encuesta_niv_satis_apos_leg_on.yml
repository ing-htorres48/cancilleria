id: encuesta_niv_satis_apos_leg_on
title: 'Encuesta nivel de satisfacción del usuario – Apostilla y Legalizaciones en línea'
description: "<p><strong>Estimado(a) Usuario(a):</strong> El Ministerio de Relaciones Exteriores se encuentra realizando una encuesta para conocer su nivel de satisfacci&oacute;n y percepci&oacute;n frente a los servicios de Apostilla y/o Legalizaci&oacute;n.</p>\r\n\r\n<p><strong>Ay&uacute;denos para prestarle un mejor servicio.</strong></p>\r\n\r\n<p><strong>Tiempo aproximado en diligenciar la encuesta: 1 minuto</strong></p>\r\n\r\n<p>&nbsp;</p>\r\n\r\n<p>&nbsp;</p>"
category: ''
elements: |-
  numero_de_apostilla:
    '#type': textfield
    '#title': 'Número de Etiqueta, Apostilla / Legalización:'
    '#autocomplete': 'off'
    '#disabled': true
    '#readonly': true
    '#prepopulate': true
    '#input_hide': true
    '#required': true
    '#unique': true
    '#unique_entity': true
  seleccione_la_forma_en_la_que_usted_realizo_el_tramite:
    '#type': radios
    '#title': '1. Seleccione la forma en la que usted realizo el trámite de Apostilla / Legalización:'
    '#options':
      1: 'De manera personal'
      2: 'A través de un familiar'
      3: 'Un tercero'
      4: 'Empresas o personas que realizan trámites'
    '#required': true
  calidad_de_informacion:
    '#type': webform_markup
    '#markup': '<p><strong>2. Calidad de Informaci&oacute;n:</strong></p>'
  considera_usted_que_el_tramite_en_linea_de_apostilla_y_legalizac:
    '#type': radios
    '#title': '2.1. Considera usted que el trámite en línea de Apostilla y Legalizaciones a través de la página web de la Cancillería fue:'
    '#options':
      1: 'Muy buena'
      2: Buena
      3: Regular
      4: Mala
      5: 'Muy mala'
    '#required': true
  su_experiencia_al_diligenciar_el_formulario_de_solicitud_en_line:
    '#type': radios
    '#title': '2.2. Su experiencia al diligenciar el formulario de solicitud en línea fue:'
    '#options':
      1: 'Muy buena'
      2: Buena
      3: Regular
      4: Mala
      5: 'Muy mala'
    '#required': true
  sugerencias_prestacion:
    '#type': textarea
    '#title': '3. Por favor, formule sus sugerencias para mejorar la prestación del servicio:'
  gracias_por_su_colaboracion:
    '#type': webform_markup
    '#markup': '<p align="center" style="margin-left:8.5pt;"><strong>&iexcl;GRACIAS POR SU COLABORACION!</strong></p>'
