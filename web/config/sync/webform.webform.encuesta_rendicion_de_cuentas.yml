id: encuesta_rendicion_de_cuentas
title: 'Encuesta rendición de cuentas'
description: "<h2>Encuesta rendici&oacute;n de cuentas</h2>\r\n\r\n<article>\r\n<h2>&nbsp;</h2>\r\n\r\n<p>El Ministerio de Relaciones Exteriores y su Fondo Rotatorio tienen como responsabilidad rendir cuentas a la ciudadan&iacute;a, con el fin de mantener una gesti&oacute;n p&uacute;blica transparente y generar beneficios y oportunidades de mejora.</p>\r\n\r\n<p>Es por esto que esta encuesta busca conocer los temas de su preferencia para mejorar su satisfacci&oacute;n en la forma en la que la Canciller&iacute;a le da a conocer los resultados de su gesti&oacute;n y aumentar los niveles de confianza en nuestra entidad.</p>\r\n\r\n<p>Tiempo estimado de respuesta: 2 minutos.</p>\r\n</article>"
category: ''
elements: |-
  1_conoce_lo_que_hace_el_ministerio_de_relaciones_exteriores_:
    '#type': radios
    '#title': '1. ¿Conoce lo que hace el Ministerio de Relaciones Exteriores?'
    '#options':
      1: si
      2: 'no'
  2_en_cuales_de_los_siguientes_temas_considera_usted_que_el_minis:
    '#type': webform_radios_other
    '#title': '2. ¿En cuáles de los siguientes temas considera usted que el Ministerio de Relaciones Exteriores debe mejorar la forma como le damos a conocer la gestión?'
    '#options':
      1: 'Desarrollo de planes de trabajo'
      2: ' Contratación pública'
      3: 'Selección de personal'
      4: 'Logros de la Entidad'
      5: 'Destinación de recursos'
      6: 'Trámites y servicios'
  3_de_los_siguientes_canales_de_comunicacion_cual_o_cuales_son_de:
    '#type': webform_radios_other
    '#title': '3. De los siguientes canales de comunicación ¿cuál o cuáles son de su preferencia para recibir información sobre la gestión del Ministerio de Relaciones Exteriores y su Fondo Rotatorio?'
    '#options':
      1: 'Correo electrónico'
      2: ' Ferias de servicios'
      3: 'Tomas regionales'
      4: 'Ruedas de prensa'
      5: ' Audiencia pública'
      6: ' Páginas oficiales en internet'
      7: ' Redes sociales (Facebook, Twitter, Instagram)'
      8: 'Boletines virtuales'
  4_como_podemos_mejorar_la_forma_en_la_que_le_contamos_la_gestion:
    '#type': webform_checkboxes_other
    '#title': '4. ¿Cómo podemos mejorar la forma en la que le contamos la gestión del Ministerio de Relaciones Exteriores?'
    '#options':
      1: 'Más canales de información'
      2: 'Mayor número de publicaciones de información'
      3: 'Lenguaje más sencillo'
  5_se_siente_satisfecho_con_la_forma_en_la_que_le_contamos_la_ges:
    '#type': webform_radios_other
    '#title': '5. ¿Se siente satisfecho con la forma en la que le contamos la gestión?'
    '#options':
      1: ' Muy satisfecho'
      2: Satisfecho
      3: 'Ni satisfecho ni insatisfecho'
      4: ' Insatisfecho'
      5: 'Muy insatisfecho'
